services:
  yeswiki-db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: yeswiki
      MARIADB_USER: yeswiki
      MARIADB_PASSWORD: password
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - yeswiki-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  yeswiki-app:
    build:
      context: .
      dockerfile: Dockerfile.lailaps
    environment:
      MYSQL_DATABASE: yeswiki
      MYSQL_USER: yeswiki
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      yeswiki-db:
        condition: service_healthy

  yeswiki-web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - yeswiki-app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/?PagePrincipale"]
      interval: 5s
      timeout: 5s
      retries: 30

  yeswiki-fixture:
    build:
      context: ${LAILAPS_BENCHMARK_RUNTIME_ROOT:?benchmark runtime root is required}
      dockerfile: Dockerfile.fixture
    depends_on:
      yeswiki-db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        until mariadb-admin ping -h yeswiki-db -u root -proot --silent; do sleep 2; done
        until [ "$(mariadb -N -s -h yeswiki-db -u root -proot -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'yeswiki' AND table_name = 'yeswiki_nature'")" = "1" ]; do sleep 2; done
        until [ "$(mariadb -N -s -h yeswiki-db -u root -proot yeswiki -e "SELECT COUNT(*) FROM yeswiki_nature WHERE bn_id_nature = 4")" = "1" ]; do sleep 2; done
        mariadb -h yeswiki-db -u root -proot yeswiki < /fixture/benchmark-fixture.sql
        rm -f /fixture/benchmark-fixture.sql
        while true; do sleep 3600; done

  yeswiki-callback:
    image: python:3.12-alpine
    ports:
      - "127.0.0.1:8090:8080"
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        import json
        events = []
        class Handler(BaseHTTPRequestHandler):
            def _reply(self, status, body):
                data = body.encode()
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
            def do_GET(self):
                events.append({"method": "GET", "path": self.path, "headers": dict(self.headers)})
                if self.path.startswith("/events"):
                    self._reply(200, json.dumps(events))
                else:
                    self._reply(200, json.dumps({"publicKey": {"id": "http://yeswiki-callback:8080/actor#main-key", "publicKeyPem": ""}}))
            def do_POST(self):
                length = int(self.headers.get("Content-Length", "0"))
                body = self.rfile.read(length).decode(errors="replace")
                events.append({"method": "POST", "path": self.path, "headers": dict(self.headers), "body": body})
                self._reply(200, json.dumps({"ok": True}))
            def log_message(self, *_):
                pass
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/events"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  yeswiki-db:

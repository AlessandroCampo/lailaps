<a class="skip" href="#content">Skip to content</a>
<aside class="prototype" aria-label="Prototype controls"><strong>Lailaps · Prototype</strong><span class="filler" id="prototype-note">Fictional data · no uploads or scans are executed</span><label>Scenario <select id="scenario"><option value="first">First scan</option><option value="preparing">Preparing project</option><option value="setup-failed">Setup failed</option><option value="queued">Queued</option><option value="running">Running · planned live</option><option value="running-current">Running · current data</option><option value="reconnecting">Reconnecting</option><option value="completed">Completed</option><option value="partial">Partial</option><option value="failed">Failed · saved results</option><option value="failed-no-report">Failed · no report</option><option value="zero">No findings</option><option value="empty">No projects</option></select></label><button class="button small" id="advance" hidden>Simulate next update</button><button class="button small" id="theme">Light mode</button></aside>

services:
  # Il bersaglio, deliberatamente vulnerabile.
  dvwa:
    image: vulnerables/web-dvwa
    ports:
      - "8080:80"          # http://localhost:8080 dall'host (comodo per curl manuale)

  # L'agente di pentest, containerizzato. One-shot: esegue uno scan e termina.
  # Sotto un profilo, così `docker compose up` avvia solo il target; l'agente lo
  # lanci a richiesta con:  docker compose run --rm agent scan --category "..."
  agent:
    build: ./pentest-agent
    image: lailaps-pentest-agent:dev
    profiles: ["agent"]
    depends_on: [dvwa, playwright-worker]
    env_file:
      - ./pentest-agent/.env        # OPENROUTER_API_KEY e altri segreti (mai nell'immagine)
    environment:
      # DENTRO la rete di compose il target NON è localhost: è il nome del servizio,
      # sulla sua porta interna (80), non la 8080 pubblicata sull'host.
      ALLOWED_BASE_URL: http://dvwa
      SOURCE_ROOT: /code
      CODEBASE_MEMORY_CACHE_ROOT: /cbm-cache
      CODEBASE_MEMORY_NATIVE_CACHE_DIR: /opt/codebase-memory-launcher-cache
      DATA_FLOW_CACHE_ROOT: /cbm-cache/data-flow
      MODELS_CONFIG_FILE: /models.json
      WORKER_BROWSER_ENABLED: ${WORKER_BROWSER_ENABLED:-false}
      BROWSER_GATEWAY_URL: http://playwright-worker:3000
      BROWSER_GATEWAY_TOKEN: ${BROWSER_GATEWAY_TOKEN:-dev-browser-token-change-me}
    volumes:
      # La codebase da analizzare, in sola lettura. Punta AGENT_SOURCE_ROOT a ciò che
      # vuoi analizzare (default: la cartella target/ del repo). Deve corrispondere
      # all'app servita da ALLOWED_BASE_URL perché il match statico↔dinamico abbia senso.
      - ${AGENT_SOURCE_ROOT:-../target}:/code:ro
      # Configurazione modelli editabile dall'host senza ricreare l'immagine.
      - ./pentest-agent/Models.json:/models.json:ro
      # Indici separati per audit id; mai scritti nel target o nel piccolo /tmp.
      - cbm-cache:/cbm-cache
      # MVP locale: il client Python usa Docker per creare il toolbox isolato e
      # fare exec SOLO sul container target fissato da Laravel. Da rimuovere
      # quando verra' introdotto il broker di produzione.
      - /var/run/docker.sock:/var/run/docker.sock
      # DEV opzionale: monta i sorgenti dell'agente per iterare senza rebuild
      # (uv installa il progetto in editable, quindi le modifiche a src/ sono live).
      # Scommenta per sviluppare:
      # - ./pentest-agent/src:/app/src

  # Dedicated P0 browser transport. It has no source/artifact/Docker-socket mounts;
  # the Worker talks to it only over the compose-internal network with a token.
  playwright-worker:
    build: ./playwright-worker
    image: lailaps-playwright-worker:dev
    profiles: ["agent"]
    environment:
      BROWSER_GATEWAY_TOKEN: ${BROWSER_GATEWAY_TOKEN:-dev-browser-token-change-me}
      BROWSER_TARGET_ORIGIN: http://dvwa
      BROWSER_MAX_NETWORK_EVENTS: 200
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /dev/shm:rw,noexec,nosuid,nodev,size=128m
    cap_drop: ["ALL"]
    cap_add: ["SYS_CHROOT"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./playwright-worker/seccomp_profile.json
    init: true
    mem_limit: 768m
    pids_limit: 256

volumes:
  cbm-cache:
